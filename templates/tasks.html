{% extends 'base.html' %}
{% load static %}
{% block content %}

<link rel="stylesheet" href="{% static 'css/homePages/tasks.css' %}">

<div class="container" style="padding-top: 6rem;">
  <div class="d-flex flex-wrap justify-content-between gap-4">
    
    <!-- Gráfico Ventas Diarias -->
    <div class="card shadow flex-fill" style="min-width: 320px; max-width: 48%;">
      <div class="card-header bg-success text-white">Ventas diarias</div>
      <div class="card-body">
        <canvas id="chart1" width="400" height="200"></canvas>
      </div>
    </div>

    <!-- Gráfico Clientes Nuevos -->
    <div class="card shadow flex-fill" style="min-width: 320px; max-width: 48%;">
      <div class="card-header bg-success text-white">Clientes nuevos</div>
      <div class="card-body">
        <canvas id="chart2" width="400" height="165"></canvas>
      </div>
    </div>

    <!-- Productos más vendidos -->
    <div class="card shadow flex-fill" style="min-width: 320px; max-width: 48%;">
      <div class="card-header bg-dark text-white">Productos más vendidos</div>
      <div class="card-body">
        <!-- Aquí agregas el contenido de productos -->
      </div>
    </div>

    <!-- Información general -->
    <div class="card shadow flex-fill" style="min-width: 320px; max-width: 48%;">
      <div class="card-header bg-dark text-white">Información general</div>
      <div class="card-body">
        <div class="row g-3">
          <div class="col-6">
            <a href="{% url 'viewClient' %}" class="text-decoration-none">
              <div class="card bg-info text-white text-center hover-card p-2">
                <h5>Clientes Registrados</h5>
                <p>{{ num_Customers }}</p>
              </div>
            </a>
          </div>
          <div class="col-6">
            <a href="{% url 'viewItem' %}" class="text-decoration-none">
              <div class="card bg-success text-white text-center hover-card p-2">
                <h5>Productos Disponibles</h5>
                <p>{{ num_items }}</p>
              </div>
            </a>
          </div>
          <div class="col-6">
            <div class="card bg-warning text-white text-center hover-card p-2">
              <h5>Ventas del Mes</h5>
              <p>$10,000</p>
            </div>
          </div>
          <div class="col-6">
            <div class="card bg-danger text-white text-center hover-card p-2">
              <h5>Pedidos Pendientes</h5>
              <p>20</p>
            </div>
          </div>
        </div>
      </div>
    </div>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
  const dates = JSON.parse('{{ dates|escapejs }}');
  const counts = JSON.parse('{{ counts|escapejs }}');

  const ctx2 = document.getElementById('chart2').getContext('2d');
  new Chart(ctx2, {
    type: 'bar',
    data: {
      labels: dates,
      datasets: [{
        label: 'Clientes Nuevos',
        data: counts,
        backgroundColor: 'rgba(54, 176, 9)',
        borderColor: 'rgba(0, 0, 0)',
        borderWidth: 1
      }]
    },
    options: {
      scales: {
        y: { beginAtZero: true }
      }
    }
  });
</script>

{% endblock %}
