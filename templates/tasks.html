{% extends 'base.html' %}
{% load static %}
{% block content %}

<link rel="stylesheet" href="{% static 'css/homePages/tasks.css' %}">

<div class="container" style="padding-top: 6rem;">
  <div class="d-flex flex-wrap justify-content-between gap-4">
    
    <!-- Gráfico Ventas Diarias -->
    <div class="card shadow flex-fill" style="min-width: 320px; max-width: 48%;">
      <div class="card-header bg-success text-white">Ventas diarias</div>
      <div class="card-body">
        <canvas id="chart1" width="200" height="200"></canvas>
      </div>
    </div>

    <!-- Gráfico Clientes Nuevos -->
    <div class="card shadow flex-fill" style="min-width: 320px; max-width: 48%;">
      <div class="card-header bg-success text-white">Clientes nuevos</div>
      <div class="card-body">
        <canvas id="chart2" width="400" height="165"></canvas>
      </div>
    </div>

    <!-- Productos más vendidos -->
    <div class="card shadow flex-fill" style="min-width: 320px; max-width: 48%;">
      <div class="card-header bg-dark text-white">Productos más vendidos</div>
      <div class="card-body">
        <canvas id="chart3" width="400" height="165"></canvas>
      </div>
    </div>

    <!-- Información general -->
    <div class="card shadow flex-fill" style="min-width: 320px; max-width: 48%;">
      <div class="card-header bg-dark text-white">Información general</div>
      <div class="card-body">
        <div class="row g-3">
          <div class="col-6">
            <a href="{% url 'viewClient' %}" class="text-decoration-none">
              <div class="card bg-info text-white text-center hover-card p-2">
                <h5>Clientes Registrados</h5>
                <p>{{ num_Customers }}</p>
              </div>
            </a>
          </div>
          <div class="col-6">
            <a href="{% url 'viewItem' %}" class="text-decoration-none">
              <div class="card bg-success text-white text-center hover-card p-2">
                <h5>Productos Disponibles</h5>
                <p>{{ num_items }}</p>
              </div>
            </a>
          </div>
          <div class="col-6">
            <div class="card bg-warning text-white text-center hover-card p-2">
              <h5>Ventas</h5>
              <p>{{ num_total }}</p>
            </div>
          </div>
          <div class="col-6">
            <div class="card bg-danger text-white text-center hover-card p-2">
              <h5>Pedidos Pendientes</h5>
              <p>20</p>
            </div>
          </div>
        </div>
      </div>
    </div>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
const datesClients = JSON.parse('{{ dates_clients|escapejs }}');
const countsClients = JSON.parse('{{ counts_clients|escapejs }}');
const datesSales = JSON.parse('{{ dates_sales|escapejs }}');
const totalsSales = JSON.parse('{{ totals_sales|escapejs }}');
const productsNames = JSON.parse('{{ products_names|escapejs }}');
const productsSales = JSON.parse('{{ products_sales|escapejs }}');

const ctx2 = document.getElementById('chart2').getContext('2d');
new Chart(ctx2, {
    type: 'bar',
    data: {
        labels: datesClients,
        datasets: [{
            label: 'Clientes Nuevos',
            data: countsClients,
            backgroundColor: '#2f855a',
            borderColor: 'rgba(0, 0, 0)',
            borderWidth: 1
        }]
    },
    options: {
        scales: {
            y: { beginAtZero: true }
        }
    }
});

// Gráfico de Ventas Diarias (tipo Donut)
const ctx1 = document.getElementById('chart1').getContext('2d');
new Chart(ctx1, {
    type: 'doughnut',
    data: {
        labels: datesSales,
        datasets: [{
            label: 'Ventas Diarias',
            data: totalsSales,
            backgroundColor: [
                '#2f855a', '#00000', '#FFCE56', '#4BC0C0', '#9966FF', '#FF9F40'
            ],
            hoverOffset: 4
        }]
    },
    options: {
        responsive: true,
        plugins: {
            legend: {
                position: 'top',
            },
            title: {
                display: true,
                text: 'Ventas Diarias'
            }
        }
    }
});

const ctx3 = document.getElementById('chart3').getContext('2d');
new Chart(ctx3, {
    type: 'bar',
    data: {
        labels: productsNames,
        datasets: [{
            label: 'Cantidad Vendida',
            data: productsSales,
            backgroundColor: [
                '#4dc9f6', '#f67019', '#f53794', '#537bc4', '#acc236',
                '#166a8f', '#00a950', '#58595b', '#8549ba'
            ],
            borderWidth: 1
        }]
    },
    options: {
        indexAxis: 'y', 
        scales: {
            x: {
                beginAtZero: true
            }
        },
        responsive: true,
        plugins: {
            legend: {
                display: false
            },
            title: {
                display: true,
                text: 'Productos Más Vendidos'
            }
        }
    }
});

</script>

{% endblock %}
