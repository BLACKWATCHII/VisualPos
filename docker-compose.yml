services:
  django:
    build: .
    container_name: django_app
    ports:
      - "8083:8000"
    environment:
      # Dentro de Docker Compose, el host correcto es el nombre del servicio.
      - BAILEYS_URL=http://whatsapp:3030
      # Base de datos (remota en Hostinger). Define estas variables en tu entorno.
      # - DB_ENGINE=mysql
      # - DB_NAME=...
      # - DB_USER=...
      # - DB_PASSWORD=...
      # - DB_HOST=srvXXX.hstgr.io
      # - DB_PORT=3306
    depends_on:
      - whatsapp
    restart: unless-stopped

  whatsapp:
    build: ./baileys
    container_name: whatsapp_baileys
    ports:
      - "3030:3030"
    environment:
      # Importante: en Docker debe escuchar en todas las interfaces.
      - BAILEYS_HOST=0.0.0.0
      - BAILEYS_PORT=3030
      - BAILEYS_AUTH_DIR=/app/auth
    volumes:
      - ./baileys/auth:/app/auth
      - ./baileys/uploads:/app/uploads
    restart: unless-stopped
