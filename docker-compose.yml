services:
  django:
    build: ./django
    container_name: django_app
    ports:
      - "8000:8000"
    volumes:
      - ./django:/app
    depends_on:
      - whatsapp

  whatsapp:
    build: ./baileys
    container_name: whatsapp_baileys
    ports:
      - "3030:3030"
    volumes:
      - ./baileys:/app
    restart: unless-stopped
